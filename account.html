<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الحساب | MFX Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <aside class="dash-sidebar">
    <div class="logo" style="margin-bottom:32px; padding:0 8px;">
      <div class="logo-mark">👨‍🏫</div>
      <span class="text-gradient">MFX Admin</span>
    </div>
    <nav>
      <a href="index.html" class="dash-nav-item"><span>📊</span> لوحة التحكم</a>
      <a href="units.html" class="dash-nav-item"><span>🎓</span> الكورسات</a>
      <a href="codes.html" class="dash-nav-item"><span>🎫</span> توليد الأكواد</a>
      <a href="students.html" class="dash-nav-item"><span>👥</span> الطلاب</a>
      <a href="exams.html" class="dash-nav-item"><span>📝</span> النتائج والامتحانات</a>
      <a href="presentations.html" class="dash-nav-item"><span>📊</span> العروض التقديمية</a>
      <a href="chat.html" class="dash-nav-item"><span>💬</span> المحادثات</a>
      <a href="account.html" class="dash-nav-item active"><span>🔒</span> الحساب</a>
      <a href="#" class="dash-nav-item" onclick="logout()" style="margin-top:auto; color:var(--danger);"><span>🚪</span> خروج</a>
    </nav>
  </aside>

  <main class="dash-main">
    <div style="margin-bottom:32px;">
      <h1 style="font-size:1.6rem;">🔒 الحساب</h1>
      <p style="color:var(--text-secondary); margin-top:4px;">غيّر كلمة مرور حساب الأدمن</p>
    </div>

    <div style="background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-lg); padding:32px; max-width:480px;">
      <div class="form-group">
        <label>كلمة المرور الحالية</label>
        <input type="password" class="inp" id="current-password" autocomplete="current-password">
      </div>
      <div class="form-group">
        <label>كلمة المرور الجديدة (8 حروف على الأقل)</label>
        <input type="password" class="inp" id="new-password" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label>تأكيد كلمة المرور الجديدة</label>
        <input type="password" class="inp" id="confirm-password" autocomplete="new-password">
      </div>
      <button class="btn btn-primary" onclick="changeAdminPassword()">💾 تغيير كلمة المرور</button>
    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
