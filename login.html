<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دخول المعلم | MFX Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="logo" style="justify-content:center; margin-bottom:36px;">
        <div class="logo-mark">👨‍🏫</div>
        <span class="text-gradient">MFX Admin</span>
      </div>
      <h2>دخول المعلم</h2>
      <p>لوحة تحكم خاصة بالمعلم</p>

      <form id="admin-login-form" onsubmit="handleAdminLogin(event)">
        <div class="form-group">
          <label>اسم المستخدم</label>
          <input type="text" class="inp" id="admin-user" placeholder="اسم المستخدم" required>
        </div>
        <div class="form-group">
          <label>كلمة المرور</label>
          <input type="password" class="inp" id="admin-pass" placeholder="كلمة المرور" required>
        </div>
        <button type="submit" class="btn btn-primary" id="admin-login-submit-btn" style="width:100%; margin-top:8px;">دخول</button>
      </form>
    </div>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
