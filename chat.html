<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المحادثات | MFX Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <aside class="dash-sidebar">
    <div class="logo" style="margin-bottom:32px; padding:0 8px;">
      <div class="logo-mark">👨‍🏫</div>
      <span class="text-gradient">MFX Admin</span>
    </div>
    <nav>
      <a href="index.html" class="dash-nav-item"><span>📊</span> لوحة التحكم</a>
      <a href="units.html" class="dash-nav-item"><span>🎓</span> الكورسات</a>
      <a href="codes.html" class="dash-nav-item"><span>🎫</span> توليد الأكواد</a>
      <a href="students.html" class="dash-nav-item"><span>👥</span> الطلاب</a>
      <a href="exams.html" class="dash-nav-item"><span>📝</span> النتائج والامتحانات</a>
      <a href="presentations.html" class="dash-nav-item"><span>📊</span> العروض التقديمية</a>
      <a href="chat.html" class="dash-nav-item active"><span>💬</span> المحادثات</a>
      <a href="#" class="dash-nav-item" onclick="logout()" style="margin-top:auto; color:var(--danger);"><span>🚪</span> خروج</a>
    </nav>
  </aside>

  <main class="dash-main">
    <div style="margin-bottom:24px;">
      <h1 style="font-size:1.6rem;">💬 المحادثات مع الطلاب</h1>
      <p style="color:var(--text-secondary); margin-top:4px;">رد على أسئلة الطلاب مباشرة</p>
    </div>

    <div style="display:grid; grid-template-columns: 300px 1fr; gap:20px; height:65vh;">
      <div style="background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-lg); overflow-y:auto; padding:8px;" id="chat-threads">
        <p style="color:var(--text-muted); padding:12px;">⏳ جاري التحميل...</p>
      </div>

      <div style="background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-lg); display:flex; flex-direction:column;">
        <div style="padding:16px; border-bottom:1px solid var(--border); font-weight:600;" id="chat-with-title">💬 اختر طالب من القائمة</div>
        <div id="chat-messages" style="flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:12px;"></div>
        <div style="display:flex; gap:10px; padding:16px; border-top:1px solid var(--border);">
          <input type="text" id="chat-input" class="inp" placeholder="اكتب ردك..." maxlength="4000" onkeydown="if(event.key==='Enter') sendAdminChatMessage()">
          <button class="btn btn-primary" onclick="sendAdminChatMessage()">إرسال</button>
        </div>
      </div>
    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
