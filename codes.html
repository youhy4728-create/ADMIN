<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>توليد الأكواد | MFX Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <aside class="dash-sidebar">
    <div class="logo" style="margin-bottom:32px; padding:0 8px;">
      <div class="logo-mark">👨‍🏫</div>
      <span class="text-gradient">MFX Admin</span>
    </div>
    <nav>
      <a href="index.html" class="dash-nav-item"><span>📊</span> لوحة التحكم</a>
      <a href="codes.html" class="dash-nav-item active"><span>🎫</span> توليد الأكواد</a>
      <a href="students.html" class="dash-nav-item"><span>👥</span> الطلاب</a>
      <a href="exams.html" class="dash-nav-item"><span>📝</span> النتائج والامتحانات</a>
      <a href="presentations.html" class="dash-nav-item"><span>📊</span> العروض التقديمية</a>
      <a href="chat.html" class="dash-nav-item"><span>💬</span> المحادثات</a>
      <a href="#" class="dash-nav-item" onclick="logout()" style="margin-top:auto; color:var(--danger);"><span>🚪</span> خروج</a>
    </nav>
  </aside>

  <main class="dash-main">
    <div style="margin-bottom:32px;">
      <h1 style="font-size:1.6rem;">🎫 توليد أكواد الطلاب</h1>
      <p style="color:var(--text-secondary); margin-top:4px;">أنشئ أكواد جديدة ووزعها على الطلاب</p>
    </div>

    <div style="background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-lg); padding:32px; margin-bottom:32px;">
      <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom:20px;">
        <div class="form-group" style="margin:0;">
          <label>الكورس</label>
          <select class="inp" id="code-course">
            <option value="">اختر الكورس</option>
          </select>
        </div>
        <div class="form-group" style="margin:0;">
          <label>عدد الأكواد</label>
          <input type="number" class="inp" id="code-count" value="10" min="1" max="100">
        </div>
        <div class="form-group" style="margin:0;">
          <label>صلاحية (أيام)</label>
          <input type="number" class="inp" id="code-expiry" value="30" min="1">
        </div>
      </div>
      <button class="btn btn-primary" onclick="generateCodes()">➕ توليد الأكواد</button>
    </div>

    <h2 style="font-size:1.2rem; margin-bottom:16px;">الأكواد المولدة</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>الكود</th>
            <th>الكورس</th>
            <th>الحالة</th>
            <th>تاريخ الإنشاء</th>
            <th>تاريخ الصلاحية</th>
          </tr>
        </thead>
        <tbody id="codes-table">
          <tr><td colspan="5" style="text-align:center; color:var(--text-muted);">لا توجد أكواد</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
